# ==========================================
# CONFIGURATION DE TEST (H2 en mémoire)
# Remplace MySQL pour les tests unitaires et d'intégration
# ==========================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT de test
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLTMyY2hhcnMh
jwt.expiration=3600000

# Désactiver les e-mails en test
app.email.enabled=false
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@smartcampus.ma
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
