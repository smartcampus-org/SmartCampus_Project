# ============================================================
# SC-98 — Docker Compose : SmartCampus + MySQL + MailHog
# ============================================================
# Usage :
#   docker-compose up -d
#   docker-compose down
#
# Variables requises dans un fichier .env :
#   DB_PASSWORD=VotreMotDePasse
#   JWT_SECRET=VotreCleBase64

services:

  # ── Application Spring Boot ──────────────────────────────
  app:
    build: .
    container_name: smartcampus-app
    ports:
      - "8083:8083"
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/smartcampus_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartcampus-net
    restart: unless-stopped

  # ── MySQL ────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: smartcampus-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: smartcampus_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartcampus-net
    restart: unless-stopped

  # ── MailHog (serveur SMTP de test) ───────────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: smartcampus-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface web → http://localhost:8025
    networks:
      - smartcampus-net
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  smartcampus-net:
    driver: bridge
