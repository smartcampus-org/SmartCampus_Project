
# ==========================================
# APPLICATION
# ==========================================

spring.application.name=smartcampus


# ==========================================
# CONFIGURATION MYSQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/smartcampus_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

spring.datasource.username=root

spring.datasource.password=${DB_PASSWORD}


# ==========================================
# CONFIGURATION JPA / HIBERNATE
# ==========================================

# Afficher les requêtes SQL dans la console
spring.jpa.show-sql=true

# Formater les requêtes SQL pour une meilleure lisibilité
spring.jpa.properties.hibernate.format_sql=true

# Hibernate crée les tables manquantes sans supprimer les tables existantes
spring.jpa.hibernate.ddl-auto=update

# Dialecte MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ==========================================
# CONFIGURATION DU SERVEUR
# ==========================================

server.port=8080


# ==========================================
# CONFIGURATION DES LOGS
# ==========================================

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.orm.jdbc.bind=TRACE



# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
