
# ==========================================
# APPLICATION
# ==========================================

spring.application.name=smartcampus


# ==========================================
# CONFIGURATION MYSQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/smartcampus_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

spring.datasource.username=root

spring.datasource.password=${DB_PASSWORD}


# ==========================================
# CONFIGURATION JPA / HIBERNATE
# ==========================================

# Afficher les requêtes SQL dans la console
spring.jpa.show-sql=true

# Formater les requêtes SQL pour une meilleure lisibilité
spring.jpa.properties.hibernate.format_sql=true

# Hibernate crée les tables manquantes sans supprimer les tables existantes
spring.jpa.hibernate.ddl-auto=update

# Dialecte MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ==========================================
# CONFIGURATION DU SERVEUR
# ==========================================

server.port=8083


# ==========================================
# CONFIGURATION DES LOGS
# ==========================================

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.orm.jdbc.bind=TRACE



# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000


# ==========================================
# SC-95 — CONFIGURATION E-MAIL
# ==========================================

# Mettre à true pour envoyer de vrais e-mails via SMTP
# Laisser à false pour le mode simulation (logs uniquement)
app.email.enabled=false

# Adresse expéditrice
spring.mail.username=noreply@smartcampus.ma

# -- Configuration SMTP réel (décommentez et remplissez si app.email.enabled=true) --
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.password=${MAIL_PASSWORD}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# -- Configuration MailHog (test local, lancez : docker run -p 1025:1025 -p 8025:8025 mailhog/mailhog) --
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ==========================================
# SC-100 — SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
